name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # -----------------------------------------
      # MySQL Service
      # -----------------------------------------
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------
      # 2. Setup JDK 21
      # -----------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------------------
      # 3. Build and Run Unit Tests (with DB)
      # -----------------------------------------
      - name: Build and Test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
        run: |
          mvn clean verify

      # -----------------------------------------
      # 4. Generate / Verify JaCoCo Coverage
      # -----------------------------------------
      - name: Generate JaCoCo Coverage Report
        run: |
          mvn jacoco:report

      # -----------------------------------------
      # 5. Check Code Coverage >= 90%
      # -----------------------------------------
      - name: Check Code Coverage
