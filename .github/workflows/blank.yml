name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------
      # 2. Setup JDK 21
      # -----------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------------------
      # 3. Build and Run Unit Tests
      # -----------------------------------------
      - name: Build and Test
        run: |
          mvn clean verify

      # -----------------------------------------
      # 4. Generate / Verify JaCoCo Coverage
      # -----------------------------------------
      - name: Generate JaCoCo Coverage 
